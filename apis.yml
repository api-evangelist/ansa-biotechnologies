aid: ansa-biotechnologies
name: Ansa Biotechnologies
description: 'Ansa Biotechnologies is a synthetic DNA manufacturer headquartered in Emeryville,
  California, founded in 2017 as a UC Berkeley spinout. Its enzymatic DNA synthesis platform is
  built on TdT-dNTP conjugates — enzymatic reagents that add single bases to a growing DNA molecule
  — and is sold as a made-to-order laboratory service producing sequence-verified double-stranded
  DNA fragments up to 600 bp, clonal DNA up to 7.5 kb, and ultra-long clonal constructs up to 50 kb.
  Quotes and orders are placed through a Salesforce Experience Cloud customer portal at
  portal.ansabio.com. Ansa is a wet-lab manufacturer rather than a software company: it publishes
  no public API, developer portal, SDK, or machine-readable specification.'
